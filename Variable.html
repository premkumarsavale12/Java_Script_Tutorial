<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Variable </title>
</head>

<body>

    <h1> This is Variable </h1>
    <script>

        // var ----> variable
        var a = 10;
        var a = 20;

        document.write(a);

        // new line -----> use <br> 
        document.write("<br>");
        document.write("<br>")

        var b = "Premkumar Savale";
        var b = "Apeksha Bavskar";


        document.write(b);

        document.write("<br>");
        document.write("<br>")

        // let ------> variable 


        let c = "Ajay Patil";

        c = "Pavan Mahajan "


        document.write(c);




    </script>
</body>

</html>
