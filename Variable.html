<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Variable </title>

</head>

<body>

    <script>
        // var 


        var a = "Premkumar Savale";

        var a = "Vaibhav Savale";

        document.write(a)  // Vaibhav Savale 

        document.write("<br>");


        // let 

        let b = 20;

        b = 30;

        document.write(b);

        document.write("<br>");


        // const 

        const c = "Amol";

        document.write(c);

        document.write("<br>");


    </script>

</body>

</html>
