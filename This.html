<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This Keyword </title>

</head>

<body>

    <script>
        var person = {

            FirstName: 'Vaibhav',
            SecondName: 'Savale',

            FullName: function () {
                return this.FirstName + this.SecondName
            }
        };

        document.write(person.FullName)
    </script>
</body>

</html>
