<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Array Method </title>
</head>

<body>

    <script>

        var p = [10, 20, 30, 40, 50];

        for (var a = 0; a <= 3; a++) {
            document.write(p[a]);
            document.write("<br>")

        }
    </script>
</body>

</html>
