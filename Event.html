<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event in Java Script </title>
</head>

<body>

    <h1> This is Event Concept using java script </h1>
    <button onclick="clickMe()"> Click me </button>
    <br />
    <br />

    <button ondblclick="dbl()"> Double Click Me </button>
    <br />
    <br />


    <button onmousemove="movs()"> MouseOver Event </button>

    <script>

        const clickMe = () => {
            alert("Welcome to Java Script Language..... ")
        }




        const dbl = () => {

            alert("Welcome to Dbl Click me ");

        }


        const movs = () => {

            alert("Welcome to Movs Hover ");

        }




    </script>
</body>

</html>
