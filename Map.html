<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Filter </title>
</head>

<body>
    <script>

        var a = [10, 20, 30, 40, 50, 60];

        var b = a.filter(data);

        document.write(b);


        function data(a) {
            return a > 30;

        }


    </script>

</body>

</html>
