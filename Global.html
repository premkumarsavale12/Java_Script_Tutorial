<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Global </title>
</head>

<body>

    <h1>This is Global Variable </h1>

    <script>

        var a = "Premkumar Savale";

        const data = () => {
            document.write(a);

        }
        data();
        document.write("<br>")
        document.write(a);


    </script>
