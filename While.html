<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While Loop </title>
</head>

<body>

<script>
     var a = 2;
      while(a<=20)
      {
        document.write(a);
         document.write("<br>");
          a=a+2;

      }
       
</script>
</body>

</html>
