<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do while </title>
</head>
<body>
    
     <script>
         
          var a = 2;
           do 
            {
                 document.write(a);
                  document.write("<br>");
                   a=a+2;
                
            }while(a<=20);
             
     </script>
</body>
</html>
