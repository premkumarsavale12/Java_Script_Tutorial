<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Loop</title>
</head>

<body>
    <script>

        for (let a= 2; a<= 20; a = a + 2) {
            document.write(a);
            document.write("<br>");


        }
    </script>
</body>

</html>
